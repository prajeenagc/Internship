<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="{% url 'create_task' %}">Create Task</a>
    {% for task in tasks %}
        <ul>
            <li>
                <h3>{{task.title}}</h3>
                <p>{{task.description}}</p>
                {% if task.is_completed %}:
                    <h3>Completed</h3>
                {% else %}:
                    <h3>Todo</h3>
                {% endif %}
                <a href="{% url 'delete_task' task.id%}">Delete Task</a>
                <a href="{% url 'edit_task' task.id %}">Edit Task</a>
 
            </li>
        </ul>
    
    {% empty %}
        <p>No tasks available</p>
    
        {% endfor %}

    
    


    
</body>
</html>
